name: Bug Report
description: File a bug report for ai-sdk-threads
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: ["nixrajput"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Before submitting, please check the [existing issues](https://github.com/nixrajput/ai-sdk-threads/issues) to avoid duplicates.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of ai-sdk-threads is affected?
      multiple: false
      options:
        - Thread store (createThreadStore)
        - Drizzle schema / migrations
        - Message ordering (chains, activeLeafId)
        - convertToUIMessages
        - Types / TypeScript
        - Packaging / exports / build
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you see, and what did you expect?
      placeholder: "Expected: ... Actual: ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal snippet plus the command you ran. Smaller repros get fixed faster.
      placeholder: |
        1. `const store = createThreadStore(db)`
        2. `await store.appendMessages(threadId, [...])`
        3. `await store.loadMessages(threadId)`
        4. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ai-sdk-threads version
      description: The version you are running.
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: sdk
    attributes:
      label: AI SDK version
      description: The version of the `ai` package you are using.
      placeholder: "e.g. ai 7.0.58"
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database / driver
      description: Which Postgres driver does your drizzle instance use?
      multiple: false
      options:
        - "node-postgres (pg)"
        - "postgres.js"
        - "@neondatabase/serverless"
        - "@vercel/postgres"
        - "@electric-sql/pglite"
        - Other
        - Not applicable
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Node and drizzle-orm versions
      description: Output of `node -v` and your drizzle-orm version.
      placeholder: "e.g. node v22.16.0, drizzle-orm 0.45.2"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste the failing output or stack trace. Formatted as code.
      render: shell

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue you agree to follow our [Code of Conduct](https://github.com/nixrajput/ai-sdk-threads/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
