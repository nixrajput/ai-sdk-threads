# .github/labeler.yml — path-based PR auto-labels (actions/labeler@v5 format).
documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', '.githooks/**']
dependencies:
  - changed-files:
      - any-glob-to-any-file: ['package.json', 'package-lock.json']
tests:
  - changed-files:
      - any-glob-to-any-file: ['test/**']
core:
  - changed-files:
      - any-glob-to-any-file: ['src/types.ts', 'src/chain.ts', 'src/convert.ts']
drizzle:
  - changed-files:
      - any-glob-to-any-file: ['src/drizzle/**']
